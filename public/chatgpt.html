<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jax Incorporated</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" href="/assets/images/jax.png">
  <link rel="stylesheet" href="/css/styles.css">
<style>
  /* General Chat Container */
  body {
    background-color: #6b4f3f; 
    color: #f4e4d4; 
    font-family: Arial, sans-serif;
  }

  #chat-container {
    max-width: 700px;
    margin: 50px auto;
    padding: 10px;
    border: 1px solid #a89f91; 
    border-radius: 10px;
    background-color: #5e4332; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  /* Chat display area */
  #chat-display {
    height: 500px;
    overflow-y: auto;
    padding: 20px;
    margin-bottom: 10px;
    border-bottom: 1px solid #a89f91;
    scroll-behavior: smooth;
    background-color: #5e4332;
  }

  /* User and AI message styles */
  .message {
    margin-bottom: 15px;
    display: flex;
    max-width: 80%;
  }

  .user-message {
    background-color: #5e4332;
    color: #f4e4d4; 
    padding: 12px 18px;
    border: 2px solid #c9a98a; 
    border-radius: 20px;
    align-self: flex-end;
    margin-left: auto;
    font-size: 14px;
    word-wrap: break-word;
  }

  .ai-message {
    background-color: #5e4332;
    color: #f4e4d4; 
    padding: 12px 18px;
    border: 2px solid #a89f91; 
    border-radius: 20px;
    align-self: flex-start;
    margin-right: auto;
    font-size: 14px;
    word-wrap: break-word;
  }

  /* Code block inside AI message */
  .ai-message code {
    display: block;
    background-color: #8c6a4c;
    color: #f4e4d4; 
    padding: 12px;
    border-radius: 8px;
    font-family: "Courier New", Courier, monospace;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* Input area */
  #user-input {
    width: calc(100% - 120px);
    padding: 12px;
    border: 2px solid #a89f91; 
    border-radius: 25px;
    margin-right: 10px;
    font-size: 14px;
    background-color: #8c6a4c; 
    color: #f4e4d4; 
  }

  /* Send button */
  #send-button {
    padding: 12px 20px;
    color: #f4e4d4; 
    border: 2px solid #c9a98a; 
    border-radius: 25px;
    cursor: pointer;
    font-size: 14px;
    background-color: transparent;
    transition: background-color 0.3s, color 0.3s;
  }

  #send-button:hover {
    background-color: #c9a98a; 
    color: #5e4332; 
  }

  /* Typing indicator */
  .typing-indicator {
    font-style: italic;
    color: #d4b597; 
    margin-top: 10px;
  }

  nav a {
    color: #f4e4d4; 
  }

  nav a:hover {
    color: #6b4f3f; 
  }
</style>
</head>
<body>
  <header>
    <img src="/assets/images/jax.png" alt="Jax Incorporated Logo">
    <span id="logo-name">Jax Incorporated</span>
    <nav>
      <a href="/">Home</a>
      <a href="/games.html">Games</a> 
      <a href="/apps.html">Apps</a>      
      <a href="/search.html">Search</a>
      <a href="/chatgpt.html">ChatGPT</a>
      <a href="/settings.html">Settings</a>
    </nav>
  </header>

  <div id="chat-container">
    <div id="chat-display"></div>
    <div class="typing-indicator" id="typing-indicator"></div>
    <div style="display: flex;">
      <input type="text" id="user-input" placeholder="Ask something..." />
      <button id="send-button">Send</button>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const sendButton = document.getElementById('send-button');
  const userInputField = document.getElementById('user-input');
  const chatDisplay = document.getElementById('chat-display');

  function appendMessage(text, isAI=false){
    const div = document.createElement('div');
    div.className = isAI ? 'ai-message message' : 'user-message message';
    div.textContent = text;
    chatDisplay.appendChild(div);
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
  }

  async function getAIResponse(prompt){
    const typingIndicator = document.getElementById('typing-indicator');
    typingIndicator.textContent = "AI is typing...";
    try {
      const response = await fetch("https://api-inference.huggingface.co/models/bigscience/bloom", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ inputs: prompt })
      });
      const data = await response.json();
      const text = data?.[0]?.generated_text || "Sorry, I couldn't generate a response.";
      appendMessage(text, true);
    } catch (err) {
      appendMessage("Error: Unable to get a response.", true);
      console.error(err);
    } finally {
      typingIndicator.textContent = "";
    }
  }

  sendButton.addEventListener('click', async function () {
    const message = userInputField.value.trim();
    if(!message) return;
    appendMessage(message);
    userInputField.value = '';
    await getAIResponse(message);
  });

  userInputField.addEventListener('keydown', async (e) => {
    if(e.key === 'Enter') sendButton.click();
  });
});
</script>

<!-- Your existing theme, tab cloak, panic key, and saveChanges scripts remain unchanged -->
<!-- All other scripts from your original file are preserved -->

</body>
</html>
