<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <style>
    body {
      background: #faf8ef;
      font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      font-size: 80px;
      color: #776e65;
      margin: 0;
    }

    #game-container {
      background: #bbada0;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 10px;
    }

    .tile {
      width: 100px;
      height: 100px;
      background: #cdc1b4;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
      font-weight: bold;
      color: #776e65;
    }

    .tile[data-value="2"]    { background: #eee4da; color: #776e65; }
    .tile[data-value="4"]    { background: #ede0c8; color: #776e65; }
    .tile[data-value="8"]    { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"]   { background: #f59563; color: #f9f6f2; }
    .tile[data-value="32"]   { background: #f67c5f; color: #f9f6f2; }
    .tile[data-value="64"]   { background: #f65e3b; color: #f9f6f2; }
    .tile[data-value="128"]  { background: #edcf72; color: #f9f6f2; font-size: 35px; }
    .tile[data-value="256"]  { background: #edcc61; color: #f9f6f2; font-size: 35px; }
    .tile[data-value="512"]  { background: #edc850; color: #f9f6f2; font-size: 35px; }
    .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 30px; }
    .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 30px; }

    #score {
      margin: 20px 0;
      font-size: 24px;
      color: #776e65;
    }

    #restart {
      background: #8f7a66;
      color: #f9f6f2;
      border: none;
      border-radius: 3px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #restart:hover {
      background: #9f8b76;
    }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div id="score">Score: 0</div>
  <div id="game-container"></div>
  <button id="restart">New Game</button>

  <script>
    const gridSize = 4;
    let grid = [];
    let score = 0;

    const container = document.getElementById("game-container");
    const scoreDisplay = document.getElementById("score");

    function init() {
      grid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      score = 0;
      addTile();
      addTile();
      updateGrid();
    }

    function addTile() {
      const emptyTiles = [];
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (grid[r][c] === 0) emptyTiles.push({r, c});
        }
      }
      if (emptyTiles.length === 0) return;
      const {r, c} = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateGrid() {
      container.innerHTML = "";
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const tile = document.createElement("div");
          tile.classList.add("tile");
          const value = grid[r][c];
          if (value) {
            tile.textContent = value;
            tile.dataset.value = value;
          }
          container.appendChild(tile);
        }
      }
      scoreDisplay.textContent = "Score: " + score;
    }

    function slide(row) {
      row = row.filter(v => v);
      for (let i = 0; i < row.length - 1; i++) {
        if (row[i] === row[i + 1]) {
          row[i] *= 2;
          score += row[i];
          row[i + 1] = 0;
        }
      }
      row = row.filter(v => v);
      while (row.length < gridSize) row.push(0);
      return row;
    }

    function rotateGrid() {
      const newGrid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          newGrid[c][gridSize - 1 - r] = grid[r][c];
        }
      }
      grid = newGrid;
    }

    function flipGrid() {
      for (let r = 0; r < gridSize; r++) grid[r].reverse();
    }

    function moveLeft() {
      let changed = false;
      for (let r = 0; r < gridSize; r++) {
        const newRow = slide(grid[r]);
        if (grid[r].toString() !== newRow.toString()) changed = true;
        grid[r] = newRow;
      }
      if (changed) addTile();
      updateGrid();
    }

    function moveRight() {
      flipGrid();
      moveLeft();
      flipGrid();
    }

    function moveUp() {
      rotateGrid();
      rotateGrid();
      rotateGrid();
      moveLeft();
      rotateGrid();
    }

    function moveDown() {
      rotateGrid();
      moveLeft();
      rotateGrid();
      rotateGrid();
      rotateGrid();
    }

    document.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowLeft": moveLeft(); break;
        case "ArrowRight": moveRight(); break;
        case "ArrowUp": moveUp(); break;
        case "ArrowDown": moveDown(); break;
      }
    });

    document.getElementById("restart").addEventListener("click", init);

    init();
  </script>
</body>
</html>
